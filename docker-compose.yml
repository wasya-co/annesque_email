
services:

  app:
    image: piousbox/ruby275-nginx:0.0.16
    command: sh -c " \
      /opt/rbenv/shims/bundle --path vendor/bundle && \
      /opt/rbenv/shims/bundle exec rake db:seed && \
      /opt/rbenv/shims/bundle exec rake assets:precompile && \
      /opt/rbenv/shims/bundle exec puma -C config/puma.rb "
    container_name: app
    depends_on:
      - localstack
      - mongo
      - redis
    environment:
      - AWS_REGION=us-east-1
      - PORT=9002
      - EMAIL=${EMAIL}
      - PASSWORD=${PASSWORD}
      - POSTAL_API_SECRET=${POSTAL_API_SECRET}
      - RAILS_ENV=production
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:9002:9002"
    volumes:
      - vendor_bundle:/opt/projects/packagedapp/vendor/bundle:cached
      - type: bind
        source: ./volumes/root
        target: /root
      - type: bind
        source: ./
        target: /opt/projects/packagedapp
      ## for backups
      - type: bind
        source: ./tmp
        target: /opt/tmp
    restart: 'unless-stopped'

  app_worker_ctxs:
    image: piousbox/ruby275-nginx:0.0.16
    command: sh -c " \
      /opt/rbenv/shims/bundle --path vendor/bundle && \
      /opt/rbenv/shims/bundle exec rake wco_email:send_contexts "
    container_name: app_worker_ctxs
    # depends_on:
    #   - mongo
    #   - redis
    environment:
      - AWS_REGION=us-east-1
      - PORT=9002
      - EMAIL=${EMAIL}
      - PASSWORD=${PASSWORD}
      - POSTAL_API_SECRET=${POSTAL_API_SECRET}
      - RAILS_ENV=production
      - REDIS_URL=redis://redis:6379/0
    restart: 'unless-stopped'
    volumes:
      - vendor_bundle:/opt/projects/packagedapp/vendor/bundle:cached
      - type: bind
        source: ./volumes/root
        target: /root
      - type: bind
        source: ./
        target: /opt/projects/packagedapp

  app_worker_oats:
    image: piousbox/ruby275-nginx:0.0.16
    command: sh -c " \
      echo $RAILS_ENV && \
      /opt/rbenv/shims/bundle exec rake wco:run_office_actions "
    container_name: app_worker_oats
    # depends_on:
    #   - mongo
    #   - redis
    environment:
      - AWS_REGION=us-east-1
      - EMAIL=${EMAIL}
      - PASSWORD=${PASSWORD}
      - PORT=9002
      - POSTAL_API_SECRET=${POSTAL_API_SECRET}
      - RAILS_ENV=production
      - REDIS_URL=redis://redis:6379/0
    restart: 'unless-stopped'
    volumes:
      - vendor_bundle:/opt/projects/packagedapp/vendor/bundle:cached
      - type: bind
        source: ./volumes/root
        target: /root
      - type: bind
        source: ./
        target: /opt/projects/packagedapp

